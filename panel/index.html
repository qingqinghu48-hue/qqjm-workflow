<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清清聊加盟 · 工作流控制台</title>
<style>
  :root {
    --bg: #0e141c; --bg2: #121a24; --panel: #182230; --panel2: #1e2a3a;
    --border: #263548; --ink: #eef3f8; --sub: #8fa2b5;
    --accent: #ff8c42; --accent2: #4fc3f7; --ok: #34c77b; --bad: #f55d5d;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; min-height: 100vh; padding-bottom: 60px; }
  a { color: var(--accent2); text-decoration: none; }
  input, textarea, select { width: 100%; background: var(--panel); color: var(--ink); border: 1px solid var(--border); border-radius: 9px; padding: 9px 12px; font-size: 13.5px; font-family: inherit; outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { min-height: 90px; resize: vertical; line-height: 1.7; }
  label { display: block; font-size: 12.5px; font-weight: 600; margin: 12px 0 6px; color: var(--sub); }
  .btn { background: var(--panel2); color: var(--ink); border: 1px solid var(--border); border-radius: 10px; padding: 8px 16px; font-size: 13px; cursor: pointer; transition: all .15s; font-family: inherit; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0e141c; font-weight: 700; }
  .btn.primary:hover { filter: brightness(1.1); color: #0e141c; }
  .btn.ghost { background: transparent; }

  header { display: flex; align-items: center; gap: 24px; padding: 14px 28px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(14,20,28,0.94); backdrop-filter: blur(10px); z-index: 30; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; color: #0e141c; }
  .brand h1 { font-size: 17px; }
  .brand small { display: block; color: var(--sub); font-size: 11px; margin-top: 2px; }
  nav { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
  nav a { color: var(--sub); font-size: 13.5px; padding: 7px 13px; border-radius: 9px; font-weight: 600; }
  nav a:hover { color: var(--ink); background: var(--panel2); }
  nav a.active { color: var(--accent); background: rgba(255,140,66,0.12); }
  .badge { font-size: 12px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); color: var(--sub); white-space: nowrap; }
  .badge.ok { color: var(--ok); border-color: rgba(52,199,123,0.4); background: rgba(52,199,123,0.08); }
  .badge.run { color: var(--accent); border-color: rgba(255,140,66,0.4); background: rgba(255,140,66,0.08); }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 26px 28px 0; }
  .page-title { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .page-desc { color: var(--sub); font-size: 13px; margin-bottom: 20px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; }
  .card h3 { font-size: 15px; margin-bottom: 4px; }
  .card .sub { color: var(--sub); font-size: 12px; margin-bottom: 12px; }
  .card-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .hint { font-size: 11.5px; color: var(--sub); margin-top: 5px; line-height: 1.6; }

  .preview-box { background: var(--bg2); border: 1px dashed var(--border); border-radius: 12px; padding: 16px; min-height: 200px; }
  .preview-box h4 { font-size: 12px; color: var(--sub); margin-bottom: 12px; letter-spacing: 1px; }
  .ph-card { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-top: 8px; font-size: 13px; line-height: 1.8; }
  .ph-card b { color: var(--accent2); }
  .ph-tag { display: inline-block; background: rgba(255,140,66,0.15); color: var(--accent); border-radius: 999px; padding: 2px 10px; font-size: 11.5px; margin: 4px 4px 0 0; }
  .ph-note { font-size: 11.5px; color: var(--sub); margin-top: 8px; }

  .flow-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .fnode { flex: 1; min-width: 120px; text-align: center; padding: 12px 8px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--border); font-size: 12.5px; }
  .fnode .ic { font-size: 22px; display: block; margin-bottom: 6px; }
  .fnode.done { border-color: rgba(52,199,123,0.5); }
  .fnode.run { border-color: var(--accent); animation: pulse 1.2s infinite; }
  .fnode.failed { border-color: rgba(245,93,93,0.6); }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,140,66,0.3)} 50%{box-shadow:0 0 0 6px rgba(255,140,66,0)} }

  .outfile { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; margin-top: 8px; font-size: 13px; background: var(--bg2); }
  .outfile a { font-weight: 600; }
  .cover-preview { width: 240px; border-radius: 12px; border: 1px solid var(--border); display: block; margin-top: 10px; }
  .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--panel2); border: 1px solid var(--border); color: var(--ink); padding: 11px 22px; border-radius: 999px; font-size: 13px; opacity: 0; transition: all .25s; z-index: 200; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">清</div>
    <div><h1 id="brandName">清清聊加盟</h1><small id="brandSlogan">工作流控制台</small></div>
  </div>
  <nav>
    <a href="#/home">🏠 总览</a>
    <a href="#/collect">🔍 采集</a>
    <a href="#/select">🎯 选题</a>
    <a href="#/create">✍️ 创作</a>
    <a href="#/design">🎨 出图</a>
    <a href="#/deliver">📦 交付</a>
    <a href="#/settings">⚙️ 设置</a>
  </nav>
  <span class="badge" id="netBadge">连接中…</span>
</header>

<div class="wrap"><div id="view"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ 数据 ============ */
let content = {};
let cfg = {};
let serverMode = false;

const FALLBACK_CONTENT = {
  date: "", issue: 1,
  title1: "加盟圈今日大事件", title2: "这 3 条值得关注",
  subtitle: "每天 10:00 · 聊聊加盟圈那点事",
  tags: "#加盟 #连锁加盟 #创业日记",
  items: [
    { head: "今日重磅", body: "某头部品牌宣布开放全国加盟" },
    { head: "行业动态", body: "加盟新规落地，合同条款有变化" },
    { head: "避坑提醒", body: "这 3 类加盟项目最近别碰" }
  ],
  collect: {
    keywords: "加盟\n连锁加盟\n招商加盟",
    sources: "红餐网\n联商网\n市场监管总局",
    items: [
      { title: "某头部茶饮品牌宣布开放区域加盟", source: "红餐网", time: "08:40", summary: "优先选择有餐饮经验的创业者，加盟门槛约 30 万起。" },
      { title: "新版商业特许经营备案流程上线", source: "市场监管总局", time: "08:12", summary: "全流程线上办理，办理时长缩短至 10 个工作日。" },
      { title: "烘焙加盟下沉县城，坪效逆势上涨", source: "联商网", time: "07:55", summary: "低房租与刚需属性让盈利模型跑通。" }
    ]
  },
  select: {
    main: { title: "", angle: "", reason: "" },
    backups: [{ title: "", reason: "" }]
  },
  create: { title: "", body: "", pages: [] }
};

async function loadData() {
  try {
    const [c, cfgRes] = await Promise.all([
      fetch("/api/content", { cache: "no-store" }),
      fetch("/api/config", { cache: "no-store" })
    ]);
    if (!c.ok || !cfgRes.ok) throw new Error("offline");
    content = await c.json();
    cfg = await cfgRes.json();
    serverMode = true;
    document.getElementById("netBadge").textContent = "已连接服务器";
    document.getElementById("netBadge").className = "badge ok";
  } catch (e) {
    content = JSON.parse(JSON.stringify(FALLBACK_CONTENT));
    cfg = {};
    serverMode = false;
    document.getElementById("netBadge").textContent = "本地预览模式";
  }
  document.getElementById("brandName").textContent = (cfg.brand && cfg.brand.accountName) || "清清聊加盟";
  document.getElementById("brandSlogan").textContent = (cfg.brand && cfg.brand.slogan) || "工作流控制台";
  render();
}

async function saveContent() {
  if (!serverMode) { toast("本地预览模式，保存需部署版"); return; }
  const res = await fetch("/api/content", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(content)
  });
  toast(res.ok ? "已保存到服务器 ✅" : "保存失败");
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 1800);
}

function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

/* ============ 路由 ============ */
const PAGES = {
  home: renderHome, collect: renderCollect, select: renderSelect,
  create: renderCreate, design: renderDesign, deliver: renderDeliver, settings: renderSettings
};

/* ============ 总览 ============ */
const STEP_META = [
  { id: "collect", name: "采集", ic: "🔍" },
  { id: "select", name: "选题", ic: "🎯" },
  { id: "create", name: "创作", ic: "✍️" },
  { id: "design", name: "出图", ic: "🎨" },
  { id: "deliver", name: "交付", ic: "📦" }
];

function renderHome() {
  return `
    <div class="page-title">今日工作流</div>
    <div class="page-desc">每天自动运行，也可以手动开始。每一步都可以点上方导航单独查看和修改。</div>
    <div class="card">
      <div class="flow-row" id="flowRow">${STEP_META.map(s => `<div class="fnode" id="flow-${s.id}"><span class="ic">${s.ic}</span>${s.name}</div>`).join("")}</div>
      <div class="card-foot">
        <button class="btn primary" onclick="runWorkflow()">🚀 开始今日工作流</button>
        <button class="btn" onclick="location.hash='#/collect'">从采集开始配置 →</button>
      </div>
      <div class="hint" id="runHint">点击开始后，五个环节会依次执行，进度实时显示。</div>
    </div>
    <div style="height:16px"></div>
    <div class="card">
      <h3>最近产出</h3>
      <div class="sub">点击文件直接下载</div>
      <div id="recentOutputs">加载中…</div>
    </div>`;
}

let statusTimer = null;
async function refreshStatus() {
  clearTimeout(statusTimer);
  if (!serverMode) {
    document.getElementById("runHint").textContent = "本地预览模式：保存与运行需在部署版网站（47.116.116.67:8080）操作。";
    return;
  }
  try {
    const st = await (await fetch("/api/run/status", { cache: "no-store" })).json();
    const prog = st.progress;
    STEP_META.forEach(s => {
      const el = document.getElementById("flow-" + s.id);
      if (!el) return;
      const stp = prog && prog.steps[s.id];
      const status = !stp ? "wait" : stp.status;
      el.className = "fnode " + (status === "done" ? "done" : status === "failed" ? "failed" : status === "running" ? "run" : "");
      el.innerHTML = `<span class="ic">${s.ic}</span>${s.name} ${status === "done" ? "✅" : status === "failed" ? "❌" : status === "running" ? "🔄" : ""}`;
    });
    const runningNow = st.running || (prog && prog.current && !prog.finishedAt);
    document.getElementById("runHint").textContent = runningNow
      ? `运行中…当前：${(prog.current && STEP_META.find(s => s.id === prog.current) || {}).name || "启动中"}`
      : (prog && prog.finishedAt ? `上次运行：${prog.date} 已完成 ✅` : "点击开始，五个环节依次执行。");
    const out = await (await fetch("/api/outputs", { cache: "no-store" })).json();
    document.getElementById("recentOutputs").innerHTML = out.length
      ? out.slice(0, 3).map(o => {
          const files = o.files.filter(f => !f.startsWith("steps") && !["progress.json", "manifest.json"].includes(f));
          return `<div class="ph-card">📅 <b>${o.date}</b><br>` +
            files.map(f => `&nbsp;&nbsp;📦 <a href="/outputs/${o.date}/${encodeURIComponent(f)}" download>${esc(f)}</a>`).join("<br>") + "</div>";
        }).join("")
      : '<div class="ph-note">还没有产出，点"开始今日工作流"生成第一份。</div>';
  } catch (e) {}
  statusTimer = setTimeout(refreshStatus, 3000);
}

async function runWorkflow() {
  if (!serverMode) { toast("本地预览模式无法运行"); return; }
  const res = await fetch("/api/run", { method: "POST" });
  toast(res.ok ? "工作流已启动 🚀" : "启动失败");
  refreshStatus();
}

/* ============ 采集 ============ */
function renderCollect() {
  const c = content.collect || FALLBACK_CONTENT.collect;
  const itemsText = (c.items || []).map(it => `${it.title} | ${it.source} | ${it.time} | ${it.summary}`).join("\n");
  return `
    <div class="page-title">🔍 采集</div>
    <div class="page-desc">每天抓取的加盟圈素材在这里，你可以随时增删改。</div>
    <div class="two-col">
      <div class="card">
        <h3>编辑采集配置</h3>
        <label>关键词（每行一个）</label><textarea id="collect-keywords">${esc(c.keywords || "")}</textarea>
        <label>信息源（每行一个）</label><textarea id="collect-sources">${esc(c.sources || "")}</textarea>
        <label>素材清单（每行一条，格式：标题 | 来源 | 时间 | 摘要）</label>
        <textarea id="collect-items" style="min-height:180px">${esc(itemsText)}</textarea>
        <div class="card-foot">
          <button class="btn primary" onclick="saveCollect()">保存</button>
        </div>
      </div>
      <div class="preview-box">
        <h4>预览 · 素材清单</h4>
        <div id="collect-preview"></div>
      </div>
    </div>`;
}

function collectPreview() {
  const items = parsePipeRows(document.getElementById("collect-items").value);
  document.getElementById("collect-preview").innerHTML = items.length
    ? items.map(it => `<div class="ph-card">📌 <b>${esc(it.title)}</b><div class="ph-note">来源：${esc(it.source)} · ${esc(it.time)} · ${esc(it.summary)}</div></div>`).join("")
    : '<div class="ph-note">暂无素材</div>';
}

function parsePipeRows(text) {
  return text.split("\n").map(l => l.trim()).filter(Boolean).map(l => {
    const p = l.split("|").map(s => s.trim());
    return { title: p[0] || "", source: p[1] || "", time: p[2] || "", summary: p[3] || "" };
  });
}

function saveCollect() {
  content.collect = {
    keywords: document.getElementById("collect-keywords").value,
    sources: document.getElementById("collect-sources").value,
    items: parsePipeRows(document.getElementById("collect-items").value)
  };
  saveContent();
}

/* ============ 选题 ============ */
function renderSelect() {
  const s = content.select || FALLBACK_CONTENT.select;
  const backupsText = (s.backups || []).map(b => `${b.title} | ${b.reason}`).join("\n");
  return `
    <div class="page-title">🎯 选题</div>
    <div class="page-desc">今日主选题和备选，运行工作流时会使用这里的内容。</div>
    <div class="two-col">
      <div class="card">
        <h3>主选题</h3>
        <label>标题</label><input id="select-main-title" value="${esc((s.main && s.main.title) || "")}">
        <label>内容角度</label><input id="select-main-angle" value="${esc((s.main && s.main.angle) || "")}">
        <label>选题理由</label><textarea id="select-main-reason">${esc((s.main && s.main.reason) || "")}</textarea>
        <label>备选（每行：标题 | 理由）</label>
        <textarea id="select-backups">${esc(backupsText)}</textarea>
        <div class="card-foot"><button class="btn primary" onclick="saveSelect()">保存</button></div>
      </div>
      <div class="preview-box">
        <h4>预览 · 选题卡</h4>
        <div id="select-preview"></div>
      </div>
    </div>`;
}

function selectPreview() {
  const title = document.getElementById("select-main-title").value;
  const angle = document.getElementById("select-main-angle").value;
  const reason = document.getElementById("select-main-reason").value;
  const backups = parsePipeRows(document.getElementById("select-backups").value);
  document.getElementById("select-preview").innerHTML =
    `<div class="ph-card">🎯 <b>${esc(title || "主选题")}</b><div class="ph-note">角度：${esc(angle)}<br>理由：${esc(reason)}</div></div>` +
    backups.map(b => `<div class="ph-card">📎 ${esc(b.title)}<div class="ph-note">${esc(b.reason)}</div></div>`).join("");
}

function saveSelect() {
  content.select = {
    main: {
      title: document.getElementById("select-main-title").value,
      angle: document.getElementById("select-main-angle").value,
      reason: document.getElementById("select-main-reason").value
    },
    backups: parsePipeRows(document.getElementById("select-backups").value)
  };
  saveContent();
}

/* ============ 创作 ============ */
function renderCreate() {
  const t1 = content.title1 || ""; const t2 = content.title2 || "";
  const subtitle = content.subtitle || "";
  const tags = content.tags || "";
  const body = (content.create && content.create.body) || "";
  const pagesText = ((content.create && content.create.pages) || []).map(p => `${p.page} | ${p.copy}`).join("\n");
  return `
    <div class="page-title">✍️ 创作</div>
    <div class="page-desc">标题、正文和每张图的文案，写好后直接用于出图。</div>
    <div class="two-col">
      <div class="card">
        <h3>文案编辑</h3>
        <label>主标题（第一行）</label><input id="create-title1" value="${esc(t1)}">
        <label>副标题（第二行）</label><input id="create-title2" value="${esc(t2)}">
        <label>页面副标题</label><input id="create-subtitle" value="${esc(subtitle)}">
        <label>正文（小红书风格）</label><textarea id="create-body" style="min-height:160px">${esc(body)}</textarea>
        <label>话题标签</label><input id="create-tags" value="${esc(tags)}">
        <label>图组文案（每行：页面 | 内容）</label>
        <textarea id="create-pages" style="min-height:100px">${esc(pagesText)}</textarea>
        <div class="card-foot"><button class="btn primary" onclick="saveCreate()">保存</button></div>
      </div>
      <div class="preview-box">
        <h4>预览 · 小红书笔记</h4>
        <div id="create-preview"></div>
      </div>
    </div>`;
}

function createPreview() {
  const t1 = document.getElementById("create-title1").value;
  const t2 = document.getElementById("create-title2").value;
  const subtitle = document.getElementById("create-subtitle").value;
  const body = document.getElementById("create-body").value;
  const tags = document.getElementById("create-tags").value;
  document.getElementById("create-preview").innerHTML =
    `<div class="ph-card" style="font-size:15px"><b>${esc(t1)}｜${esc(t2)}</b><div class="ph-note">${esc(subtitle)}</div></div>` +
    `<div class="ph-card" style="white-space:pre-wrap">${esc(body || "（正文留空时运行工作流会自动生成）")}</div>` +
    `<div>${tags.split(/[\s,，]+/).filter(Boolean).map(t => `<span class="ph-tag">${esc(t)}</span>`).join("")}</div>`;
}

function saveCreate() {
  content.title1 = document.getElementById("create-title1").value;
  content.title2 = document.getElementById("create-title2").value;
  content.subtitle = document.getElementById("create-subtitle").value;
  content.tags = document.getElementById("create-tags").value;
  content.create = {
    title: `${content.title1}｜${content.title2}`,
    body: document.getElementById("create-body").value,
    pages: parsePipeRows(document.getElementById("create-pages").value)
  };
  saveContent();
}

/* ============ 出图 ============ */
function renderDesign() {
  return `
    <div class="page-title">🎨 出图</div>
    <div class="page-desc">选择模板和配色，点"保存并出图"立即生成封面。</div>
    <div class="two-col">
      <div class="card">
        <h3>出图设置</h3>
        <label>模板配色</label>
        <select id="design-theme" onchange="designPreview()">
          <option value="dark" ${(cfg.brand && cfg.brand.theme) === "dark" ? "selected" : ""}>深蓝商务版</option>
          <option value="light" ${(cfg.brand && cfg.brand.theme) === "light" ? "selected" : ""}>米白清新版</option>
        </select>
        <label>尺寸</label>
        <input id="design-size" value="${(cfg.pipeline && cfg.pipeline.width) || 1080} × ${(cfg.pipeline && cfg.pipeline.height) || 1440}" disabled>
        <div class="hint">保存配置后点击"保存并出图"：会保存你前面各页的内容，并立即运行一次完整工作流。</div>
        <div class="card-foot">
          <button class="btn primary" onclick="saveDesignAndRun()">保存并出图 🚀</button>
        </div>
      </div>
      <div class="preview-box">
        <h4>预览 · 最新封面</h4>
        <div id="design-preview">加载中…</div>
      </div>
    </div>`;
}

async function designPreview() {
  const el = document.getElementById("design-preview");
  if (!el) return;
  try {
    const out = await (await fetch("/api/outputs", { cache: "no-store" })).json();
    const latest = out[0];
    const png = latest && latest.files.find(f => f.endsWith(".png"));
    el.innerHTML = png
      ? `<img class="cover-preview" src="/outputs/${latest.date}/${encodeURIComponent(png)}" alt="最新封面"><div class="ph-note">${latest.date} · ${png}</div>`
      : '<div class="ph-note">还没有封面，点"保存并出图"生成。</div>';
  } catch (e) {
    const theme = document.getElementById("design-theme").value;
    el.innerHTML = `<img class="cover-preview" src="../templates/cover_template_${theme}.png" alt="模板预览"><div class="ph-note">本地模板预览（服务器版显示最新产出）</div>`;
  }
}

async function saveDesignAndRun() {
  if (!serverMode) { toast("本地预览模式无法运行"); return; }
  cfg.brand = cfg.brand || {}; cfg.brand.theme = document.getElementById("design-theme").value;
  await fetch("/api/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cfg) });
  await saveContent();
  await fetch("/api/run", { method: "POST" });
  toast("已保存并开始出图 🚀");
  setTimeout(designPreview, 5000);
}

/* ============ 交付 ============ */
async function renderDeliver() {
  const wrap = `
    <div class="page-title">📦 交付</div>
    <div class="page-desc">每天的成品都在这里，点击文件名下载。</div>
    <div class="card"><h3>交付清单</h3><div id="deliver-list">加载中…</div></div>`;
  return wrap;
}

async function refreshDeliver() {
  const el = document.getElementById("deliver-list");
  if (!el) return;
  try {
    const out = await (await fetch("/api/outputs", { cache: "no-store" })).json();
    el.innerHTML = out.length
      ? out.map(o => {
          const files = o.files.filter(f => !f.startsWith("steps") && !["progress.json", "manifest.json"].includes(f));
          return `<div class="ph-card"><b>📅 ${o.date}</b>` +
            files.map(f => `<div class="outfile"><span>📦 ${esc(f)}</span><a href="/outputs/${o.date}/${encodeURIComponent(f)}" download>下载</a></div>`).join("") +
            "</div>";
        }).join("")
      : '<div class="ph-note">还没有交付物。</div>';
  } catch (e) {
    el.innerHTML = '<div class="ph-note">本地预览模式：交付物在服务器 outputs/日期/ 目录。</div>';
  }
}

/* ============ 设置 ============ */
function renderSettings() {
  return `
    <div class="page-title">⚙️ 设置</div>
    <div class="page-desc">品牌信息与每日运行时间。</div>
    <div class="two-col">
      <div class="card">
        <h3>品牌信息</h3>
        <label>账号名</label><input id="set-name" value="${esc((cfg.brand && cfg.brand.accountName) || "清清聊加盟")}">
        <label>口号</label><input id="set-slogan" value="${esc((cfg.brand && cfg.brand.slogan) || "")}">
        <label>每日采集时间</label><input type="time" id="set-collect" value="${(cfg.schedule && cfg.schedule.collectTime) || "09:00"}">
        <label>每日出稿时间</label><input type="time" id="set-deliver" value="${(cfg.schedule && cfg.schedule.deliverTime) || "10:00"}">
        <div class="card-foot"><button class="btn primary" onclick="saveSettings()">保存设置</button></div>
      </div>
      <div class="preview-box">
        <h4>说明</h4>
        <div class="ph-card">🏷️ 账号名显示在网站和海报品牌栏。<br>⏰ 每天到 <b>出稿时间</b> 自动运行一次工作流（当天已产出则跳过）。<br>⚙️ 本页设置保存在服务器 config.json。</div>
      </div>
    </div>`;
}

async function saveSettings() {
  if (!serverMode) { toast("本地预览模式无法保存"); return; }
  cfg.brand = cfg.brand || {};
  cfg.brand.accountName = document.getElementById("set-name").value;
  cfg.brand.slogan = document.getElementById("set-slogan").value;
  cfg.schedule = cfg.schedule || {};
  cfg.schedule.collectTime = document.getElementById("set-collect").value;
  cfg.schedule.deliverTime = document.getElementById("set-deliver").value;
  const res = await fetch("/api/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cfg) });
  toast(res.ok ? "设置已保存 ✅" : "保存失败");
  document.getElementById("brandName").textContent = cfg.brand.accountName;
}

/* ============ 事件绑定 ============ */
function bindPage(id) {
  if (id === "collect") {
    document.getElementById("collect-items").addEventListener("input", collectPreview);
    collectPreview();
  }
  if (id === "select") {
    ["select-main-title", "select-main-angle", "select-main-reason", "select-backups"].forEach(x =>
      document.getElementById(x).addEventListener("input", selectPreview));
    selectPreview();
  }
  if (id === "create") {
    ["create-title1", "create-title2", "create-subtitle", "create-body", "create-tags"].forEach(x =>
      document.getElementById(x).addEventListener("input", createPreview));
    createPreview();
  }
  if (id === "design") designPreview();
  if (id === "deliver") refreshDeliver();
}

render = function () {
  const id = (location.hash.replace("#/", "") || "home");
  const fn = PAGES[id] || renderHome;
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#/" + id));
  document.getElementById("view").innerHTML = fn();
  bindPage(id);
  if (id === "home") refreshStatus();
};

window.addEventListener("hashchange", render);

loadData();
</script>
</body>
</html>
